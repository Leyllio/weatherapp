<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Application meteo</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="app-banner">
      <div class="banner-brand">
        <span class="rain-layer" aria-hidden="true"></span>
        <span class="logo">WeatherApp</span>
        <span class="logo-mark" aria-hidden="true"></span>
      </div>
      <div class="banner-tools">
        <div id="menu">
          <input type="text" id="city-input" placeholder="Ville" aria-label="Ville" autocomplete="off" />
          <button type="button" id="show-button">Afficher</button>
        </div>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Activer le theme nuit"
          aria-pressed="false"
        >
          <span class="theme-icon theme-icon--moon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <div id="map" class="map"></div>

    <div id="data"></div>

    <footer class="app-footer">
      Donnees <a href="https://www.prevision-meteo.ch" target="_blank" rel="noopener">prevision-meteo.ch</a>,
      fond de carte OpenStreetMap
    </footer>
  </body>
</html>
